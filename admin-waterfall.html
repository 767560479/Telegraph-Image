<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegraph-Image | 瀑布流</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/admin.css">
</head>
<body class="waterfall-page">
  <header class="admin-top-nav">
    <div class="admin-top-nav__inner">
      <a href="./admin-imgtc.html" class="admin-top-nav__title">Dashboard</a>
      <div class="admin-top-nav__actions" style="margin-left: auto;">
        <a href="./admin.html" class="button-secondary button-secondary--sm">表格视图</a>
        <a href="./admin-imgtc.html" class="button-secondary button-secondary--sm">网格视图</a>
        <a href="/" class="button-text-link">首页</a>
      </div>
    </div>
  </header>

  <main>
    <div class="waterfall-box box"></div>
    <button type="button" id="loadMore" class="button-secondary waterfall-load">加载更多</button>
  </main>

  <div id="bigimg" class="lightbox"></div>
  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Powered By <a href="https://github.com/cf-pages/Telegraph-Image" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Telegraph-Image</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="./assets/js/admin-auth.js"></script>
  <script>
    var cursor = null;
    var ITEM_WIDTH = 200;
    var ITEM_GAP = 10;

    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { el.classList.remove('show'); }, 2500);
    }

    function fileUrl(name) {
      return location.origin + '/file/' + name;
    }

    function copyUrl(name) {
      var text = fileUrl(name);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { showToast('链接已复制'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('链接已复制');
      }
    }

    function openPreview(name) {
      var bigImg = document.getElementById('bigimg');
      bigImg.innerHTML = '<img src="/file/' + encodeURIComponent(name).replace(/%2F/g, '/') + '" alt="preview">';
      bigImg.classList.add('is-open');
    }

    function closeBigImg() {
      var bigImg = document.getElementById('bigimg');
      bigImg.classList.remove('is-open');
      bigImg.innerHTML = '';
    }

    $('#bigimg').on('click', closeBigImg);

    function deleteFile(name) {
      if (!confirm('确认删除该条记录吗?')) return;
      fetch('./api/manage/delete/' + encodeURIComponent(name), { method: 'GET', credentials: 'include' })
        .then(function (r) {
          if (!r.ok) throw new Error('fail');
          $('.waterfall-item').filter(function () {
            return decodeURIComponent($(this).attr('data-name') || '') === name;
          }).remove();
          layoutWaterfall();
          showToast('删除成功');
        })
        .catch(function () { alert('删除失败，请检查网络'); });
    }

    function itemNameFromEl(el) {
      return decodeURIComponent($(el).closest('.waterfall-item').attr('data-name') || '');
    }

    function buildItemHtml(name) {
      var enc = encodeURIComponent(name);
      var src = '/file/' + name;
      return (
        '<div class="waterfall-item" data-name="' + enc + '">' +
          '<div class="waterfall-item__inner">' +
            '<img src="' + src + '" alt="" loading="lazy">' +
            '<div class="waterfall-item__overlay">' +
              '<button type="button" class="button-secondary button-secondary--sm js-wf-copy">复制</button>' +
              '<button type="button" class="button-secondary button-secondary--sm js-wf-preview">预览</button>' +
              '<button type="button" class="button-secondary button-secondary--sm js-wf-delete">删除</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    function whenImagesReady($items, done) {
      var $imgs = $items.find('img');
      if (!$imgs.length) {
        done();
        return;
      }
      var remaining = $imgs.length;
      function tick() {
        remaining -= 1;
        if (remaining <= 0) done();
      }
      $imgs.each(function () {
        if (this.complete) tick();
        else $(this).one('load error', tick);
      });
    }

    function layoutWaterfall() {
      var $box = $('.box');
      var step = ITEM_WIDTH + ITEM_GAP;
      var boxWidth = $box.innerWidth();
      var columns = Math.max(1, Math.floor((boxWidth + ITEM_GAP) / step));
      var heights = new Array(columns);
      for (var c = 0; c < columns; c++) heights[c] = 0;

      $box.find('.waterfall-item').each(function () {
        var $item = $(this);
        var minH = Math.min.apply(null, heights);
        var col = heights.indexOf(minH);
        $item.css({
          width: ITEM_WIDTH + 'px',
          top: minH + 'px',
          left: col * step + 'px'
        });
        heights[col] += $item.outerHeight(true) + ITEM_GAP;
      });

      var maxH = Math.max.apply(null, heights.concat([0]));
      $box.css('height', maxH + 'px');
    }

    $(document).on('click', '.js-wf-copy', function (e) {
      e.preventDefault();
      e.stopPropagation();
      copyUrl(itemNameFromEl(this));
    });
    $(document).on('click', '.js-wf-preview', function (e) {
      e.preventDefault();
      e.stopPropagation();
      openPreview(itemNameFromEl(this));
    });
    $(document).on('click', '.js-wf-delete', function (e) {
      e.preventDefault();
      e.stopPropagation();
      deleteFile(itemNameFromEl(this));
    });

    function loadMore() {
      $.ajax({
        url: cursor ? './api/manage/list?cursor=' + encodeURIComponent(cursor) : './api/manage/list?limit=100',
        dataType: 'json',
        xhrFields: { withCredentials: true },
        success: function (data) {
          cursor = data.list_complete ? null : data.cursor;
          var images = data.keys || [];
          var html = '';
          for (var i = 0; i < images.length; i++) {
            var name = images[i].name;
            if (!name || name.indexOf('.mp4') > 0) continue;
            html += buildItemHtml(name);
          }
          if (!html) {
            if (!cursor) $('#loadMore').hide();
            return;
          }
          var $added = $(html);
          $('.box').append($added);
          whenImagesReady($added, layoutWaterfall);
          if (!cursor) $('#loadMore').hide();
        },
        error: function (xhr) {
          if (xhr && xhr.status === 401) {
            AdminAuth.redirectToLogin();
            return;
          }
          alert('同步失败，请检查网络');
        }
      });
    }

    var resizeTimer;
    $(window).on('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layoutWaterfall, 150);
    });

    $('#loadMore').on('click', loadMore);
    AdminAuth.ensureAuth().then(function (auth) {
      if (auth.enabled && !auth.authenticated) {
        AdminAuth.redirectToLogin();
        return;
      }
      loadMore();
    });
  </script>
</body>
</html>
