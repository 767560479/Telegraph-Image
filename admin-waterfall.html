<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telegraph-Image | 瀑布流</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/admin.css">
</head>
<body class="waterfall-page">
  <header class="admin-top-nav">
    <div class="admin-top-nav__inner">
      <a href="./admin-imgtc.html" class="admin-top-nav__title">Dashboard</a>
      <div class="admin-top-nav__actions" style="margin-left: auto;">
        <a href="./admin.html" class="button-secondary button-secondary--sm">表格视图</a>
        <a href="./admin-imgtc.html" class="button-secondary button-secondary--sm">网格视图</a>
        <a href="/" class="button-text-link">首页</a>
      </div>
    </div>
  </header>

  <main>
    <div class="waterfall-box box"></div>
    <button type="button" id="loadMore" class="button-secondary waterfall-load" onclick="loadMore()">加载更多</button>
  </main>

  <div id="bigimg" class="lightbox" onclick="closeBigImg();"></div>
  <div class="toast" id="toast" role="status"></div>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p>Powered By <a href="https://github.com/cf-pages/Telegraph-Image" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Telegraph-Image</a></p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script>
    var cursor = null;
    var itemWidth = 200;

    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(function () { el.classList.remove('show'); }, 2500);
    }

    function fileUrl(name) {
      return location.origin + '/file/' + name;
    }

    function copyUrl(name) {
      var text = fileUrl(name);
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { showToast('链接已复制'); });
      } else {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('链接已复制');
      }
    }

    function openPreview(name) {
      var bigImg = document.getElementById('bigimg');
      bigImg.innerHTML = '<img src="/file/' + name + '" alt="preview">';
      bigImg.classList.add('is-open');
    }

    function deleteFile(name) {
      if (!confirm('确认删除该条记录吗?')) return;
      fetch('./api/manage/delete/' + name, { method: 'GET', credentials: 'include' })
        .then(function (r) {
          if (!r.ok) throw new Error('fail');
          $('.waterfall-item').filter(function () {
            return decodeURIComponent($(this).attr('data-name') || '') === name;
          }).remove();
          waterfallHandler();
          showToast('删除成功');
        })
        .catch(function () { alert('删除失败，请检查网络'); });
    }

    function itemNameFromEl(el) {
      return decodeURIComponent($(el).closest('.waterfall-item').attr('data-name') || '');
    }

    $(document).on('click', '.js-wf-copy', function (e) {
      e.stopPropagation();
      copyUrl(itemNameFromEl(this));
    });
    $(document).on('click', '.js-wf-preview', function (e) {
      e.stopPropagation();
      openPreview(itemNameFromEl(this));
    });
    $(document).on('click', '.js-wf-delete', function (e) {
      e.stopPropagation();
      deleteFile(itemNameFromEl(this));
    });
    $(document).on('click', '.waterfall-item img', function () {
      openPreview(itemNameFromEl(this));
    });

    function loadMore() {
      $.ajax({
        url: cursor ? './api/manage/list?cursor=' + encodeURIComponent(cursor) : './api/manage/list?limit=100',
        dataType: 'json',
        xhrFields: { withCredentials: true },
        success: function (data) {
          cursor = data.list_complete ? null : data.cursor;
          var images = data.keys || [];
          var html = '';
          for (var i = 0; i < images.length; i++) {
            var name = images[i].name;
            if (!name || name.indexOf('.mp4') > 0) continue;
            var enc = encodeURIComponent(name);
            html +=
              '<div class="waterfall-item" data-name="' + enc + '">' +
              '<img src="/file/' + name + '" alt="">' +
              '<div class="waterfall-item__overlay">' +
              '<button type="button" class="button-primary button-secondary--sm js-wf-copy">复制</button>' +
              '<button type="button" class="button-secondary button-secondary--sm js-wf-preview">预览</button>' +
              '<button type="button" class="button-secondary button-secondary--sm js-wf-delete">删除</button>' +
              '</div></div>';
          }
          document.querySelector('.box').insertAdjacentHTML('beforeend', html);
          if (!cursor) document.getElementById('loadMore').style.display = 'none';
          waterfallHandler();
        },
        error: function () { alert('同步失败，请检查网络'); }
      });
    }

    function waterfallHandler() {
      var column = Math.max(1, parseInt(($(window).width() - 32) / itemWidth, 10));
      var heightArr = [];
      for (var i = 0; i < column; i++) heightArr[i] = 0;
      $.each($('.waterfall-item'), function (_, item) {
        var h = $(item).outerHeight();
        var minHeight = Math.min.apply(null, heightArr);
        var minIndex = heightArr.indexOf(minHeight);
        $(item).css({ top: minHeight + 'px', left: minIndex * itemWidth + 'px' });
        heightArr[minIndex] += h;
      });
      var maxH = Math.max.apply(null, heightArr.concat([0]));
      $('.box').css('height', maxH + 'px');
    }

    $(window).resize(function () { waterfallHandler(); });

    function closeBigImg() {
      var bigImg = document.getElementById('bigimg');
      bigImg.classList.remove('is-open');
      bigImg.innerHTML = '';
    }

    loadMore();
  </script>
</body>
</html>
