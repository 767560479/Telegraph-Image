<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegraph-Image | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free/css/all.min.css">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/admin.css">
  <script src="https://js.sentry-cdn.com/219f636ac7bde5edab2c3e16885cb535.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app" class="admin-page">
    <header class="admin-top-nav">
      <div class="admin-top-nav__inner">
        <span class="admin-top-nav__title" @click="refreshDashboard">Dashboard</span>
        <div class="admin-top-nav__search">
          <input v-model="search" class="text-input" type="search" placeholder="输入关键字搜索">
        </div>
        <span class="admin-top-nav__stats" title="批量上传" @click="handleUpload">
          <i class="fas fa-upload"></i>
          <span class="admin-top-nav__stats-text">记录数: </span>{{ Number }}
        </span>
        <input type="file" ref="fileInput" style="display: none;" multiple @change="uploadFiles">
        <div class="admin-top-nav__actions">
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'fileType' }">
            <button type="button" class="dropdown__trigger" title="文件类型" @click.stop="toggleDropdown('fileType')">
              <i :class="fileTypeIcon"></i>
            </button>
            <div class="dropdown__menu">
              <button v-for="(cfg, type) in fileConfig" :key="type" type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': fileType === type }" @click="switchFileType(type); closeDropdown()">
                <i :class="cfg.icon"></i> {{ cfg.name }}
              </button>
            </div>
          </div>
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'sort' }">
            <button type="button" class="dropdown__trigger" title="排序" @click.stop="toggleDropdown('sort')">
              <i :class="sortIcon"></i>
            </button>
            <div class="dropdown__menu">
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': sortOption === 'dateDesc' }" @click="sort('dateDesc'); closeDropdown()"><i class="fas fa-sort-amount-down"></i> 按时间倒序</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': sortOption === 'nameAsc' }" @click="sort('nameAsc'); closeDropdown()"><i class="fas fa-sort-alpha-up"></i> 按名称升序</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': sortOption === 'sizeDesc' }" @click="sort('sizeDesc'); closeDropdown()"><i class="fas fa-sort-amount-down"></i> 按大小倒序</button>
            </div>
          </div>
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'filter' }">
            <button type="button" class="dropdown__trigger" title="筛选" @click.stop="toggleDropdown('filter')">
              <i :class="filterIcon"></i>
            </button>
            <div class="dropdown__menu">
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': filterOption === 'all' }" @click="filter('all'); closeDropdown()"><i class="fas fa-filter"></i> 全部</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': filterOption === 'favorites' }" @click="filter('favorites'); closeDropdown()"><i class="fas fa-bookmark"></i> 收藏</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': filterOption === 'blocked' }" @click="filter('blocked'); closeDropdown()"><i class="fas fa-lock"></i> 黑名单</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': filterOption === 'unblocked' }" @click="filter('unblocked'); closeDropdown()"><i class="fas fa-unlock"></i> 白名单</button>
              <button type="button" class="dropdown__item" :class="{ 'dropdown__item--selected': filterOption === 'adult' }" @click="filter('adult'); closeDropdown()"><i class="fas fa-user-secret"></i> NSFW</button>
            </div>
          </div>
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'batch' }">
            <button type="button" class="dropdown__trigger" title="批量操作" @click.stop="toggleDropdown('batch')">
              <i class="fas fa-tasks"></i>
            </button>
            <div class="dropdown__menu">
              <button type="button" class="dropdown__item" :class="{ 'is-disabled': selectedFiles.length === 0 }" @click="handleBatchOperation('copy'); closeDropdown()"><i class="fas fa-link"></i> 批量复制</button>
              <button type="button" class="dropdown__item" :class="{ 'is-disabled': selectedFiles.length === 0 }" @click="handleBatchOperation('delete'); closeDropdown()"><i class="fas fa-trash-alt"></i> 批量删除</button>
              <button type="button" class="dropdown__item" :class="{ 'is-disabled': selectedFiles.length === 0 }" @click="handleBatchOperation('download'); closeDropdown()"><i class="fas fa-download"></i> 批量下载</button>
              <button type="button" class="dropdown__item" :class="{ 'is-disabled': selectedFiles.length === 0 }" @click="handleBatchOperation('block'); closeDropdown()"><i class="fas fa-lock"></i> 加入黑名单</button>
              <button type="button" class="dropdown__item" :class="{ 'is-disabled': selectedFiles.length === 0 }" @click="handleBatchOperation('unblock'); closeDropdown()"><i class="fas fa-unlock"></i> 加入白名单</button>
            </div>
          </div>
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'sites' }">
            <button type="button" class="dropdown__trigger" title="快捷方式" @click.stop="toggleDropdown('sites')">
              <i class="fas fa-link"></i>
            </button>
            <div class="dropdown__menu">
              <button v-for="site in quickWebsites" :key="site.url" type="button" class="dropdown__item" @click="handleWebsite(site.url); closeDropdown()">
                <i :class="site.icon"></i> {{ site.name }}
              </button>
            </div>
          </div>
          <div class="dropdown" :class="{ 'is-open': openDropdown === 'toolkit' }">
            <button type="button" class="dropdown__trigger" title="工具箱" @click.stop="toggleDropdown('toolkit')">
              <i class="fas fa-toolbox"></i>
            </button>
            <div class="dropdown__menu">
              <button type="button" class="dropdown__item" @click="handleToolkit('selectAllInPage'); closeDropdown()"><i class="fas fa-check-square"></i> 全选当前页</button>
              <button type="button" class="dropdown__item" @click="handleToolkit('checkBrokenFiles'); closeDropdown()"><i class="fas fa-wrench"></i> 检测失效文件</button>
              <button type="button" class="dropdown__item" @click="handleToolkit('editWebsites'); closeDropdown()"><i class="fas fa-edit"></i> 编辑快捷方式</button>
            </div>
          </div>
          <button type="button" class="dropdown__trigger" title="退出登录" @click="handleLogout"><i class="fas fa-home"></i></button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-grid">
        <template v-for="(item, index) in paginatedTableData">
          <div v-if="fileType === 'image'" :key="item.name" class="media-card" :class="{ 'is-selected': item.selected }">
            <span class="media-card__bookmark" :class="{ 'is-liked': item.metadata.liked }" @click.stop="toggleLike(index, item.name)">
              <i :class="item.metadata.liked ? 'fa-solid fa-bookmark' : 'fa-regular fa-bookmark'"></i>
            </span>
            <input type="checkbox" class="checkbox-styled media-card__checkbox" v-model="item.selected" @change="$event.target.blur()">
            <img class="media-card__img" :src="'/file/' + item.name" loading="lazy" :alt="item.metadata.fileName || item.name" @click="openLightbox('/file/' + item.name)">
            <div class="media-card__overlay">
              <div class="media-card__overlay-btns">
                <button type="button" class="button-secondary button-secondary--sm" @click.stop="handleEditName(item)">编辑</button>
                <button type="button" class="button-secondary button-secondary--sm" @click.stop="handleCopy(index, item.name)">复制</button>
                <button type="button" class="button-secondary button-secondary--sm" @click.stop="handleDelete(index, item.name)">删除</button>
              </div>
            </div>
            <div class="media-card__footer popover-wrap" :class="{ 'is-blocked': item.metadata.ListType === 'Block' }" @click.stop="togglePopover(item.name)">
              {{ item.metadata.fileName || item.name }}
              <div class="popover" :class="{ 'is-open': activePopover === item.name }" v-html="formattedFileDetails(item)"></div>
            </div>
          </div>

          <div v-else-if="fileType === 'video'" :key="item.name" class="video-card" :class="{ 'is-selected': item.selected }">
            <div class="video-card__body">
              <video :src="'/file/' + item.name" controls style="width: 100%; object-fit: cover;"></video>
              <div class="video-card__title popover-wrap" @click.stop="togglePopover(item.name)">
                <span :style="{ opacity: item.metadata.ListType === 'Block' ? 0.6 : 1 }">{{ item.metadata.fileName || item.name }}</span>
                <div class="popover" :class="{ 'is-open': activePopover === item.name }" v-html="formattedFileDetails(item)"></div>
              </div>
              <div class="media-controls">
                <button type="button" class="control-btn" @click.stop="toggleLike(index, item.name)"><i :class="item.metadata.liked ? 'fas fa-heart is-liked' : 'far fa-heart'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleEditName(item)"><i class="fas fa-edit"></i></button>
                <button type="button" class="control-btn" @click.stop="toggleSelect(index, item.name)"><i :class="item.selected ? 'fas fa-square-check is-selected' : 'far fa-square'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleCopy(index, item.name)"><i class="fas fa-link"></i></button>
                <button type="button" class="control-btn" @click.stop="handleDelete(index, item.name)"><i class="fas fa-trash-alt"></i></button>
              </div>
            </div>
          </div>

          <div v-else-if="fileType === 'audio'" :key="item.name" class="audio-card" :class="{ 'is-selected': item.selected }">
            <div class="audio-card__body">
              <div class="audio-card__header">
                <div class="audio-card__avatar"><img src="./music.svg" alt="Music"></div>
                <div>
                  <div class="audio-card__title popover-wrap" @click.stop="togglePopover(item.name)">
                    <span :style="{ opacity: item.metadata.ListType === 'Block' ? 0.6 : 1 }">{{ item.metadata.fileName || item.name }}</span>
                    <div class="popover" :class="{ 'is-open': activePopover === item.name }" v-html="formattedFileDetails(item)"></div>
                  </div>
                  <div class="audio-card__subtitle">{{ getFileType(item.name) }}</div>
                </div>
              </div>
              <audio class="custom-audio-player" :src="'/file/' + item.name" controls preload="metadata">当前浏览器不支持音频播放</audio>
              <div class="media-controls">
                <button type="button" class="control-btn" @click.stop="toggleLike(index, item.name)"><i :class="item.metadata.liked ? 'fas fa-heart is-liked' : 'far fa-heart'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleEditName(item)"><i class="fas fa-edit"></i></button>
                <button type="button" class="control-btn" @click.stop="toggleSelect(index, item.name)"><i :class="item.selected ? 'fas fa-square-check is-selected' : 'far fa-square'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleCopy(index, item.name)"><i class="fas fa-copy"></i></button>
                <button type="button" class="control-btn" @click.stop="handleDelete(index, item.name)"><i class="fas fa-trash-alt"></i></button>
              </div>
            </div>
          </div>

          <div v-else :key="item.name" class="file-card" :class="{ 'is-selected': item.selected }">
            <div class="file-card__body">
              <div class="file-card__header">
                <div class="file-card__avatar"><i :class="getFileIcon(item.name)" style="font-size: 28px;"></i></div>
                <div>
                  <div class="file-card__title popover-wrap" @click.stop="togglePopover(item.name)">
                    <span :style="{ opacity: item.metadata.ListType === 'Block' ? 0.6 : 1 }">{{ item.metadata.fileName || item.name }}</span>
                    <div class="popover" :class="{ 'is-open': activePopover === item.name }" v-html="formattedFileDetails(item)"></div>
                  </div>
                  <div class="file-card__subtitle">{{ getFileType(item.name) }}</div>
                </div>
              </div>
              <div class="media-controls">
                <button type="button" class="control-btn" @click.stop="toggleLike(index, item.name)"><i :class="item.metadata.liked ? 'fas fa-heart is-liked' : 'far fa-heart'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleEditName(item)"><i class="fas fa-edit"></i></button>
                <button type="button" class="control-btn" @click.stop="toggleSelect(index, item.name)"><i :class="item.selected ? 'fas fa-square-check is-selected' : 'far fa-square'"></i></button>
                <button type="button" class="control-btn" @click.stop="handleCopy(index, item.name)"><i class="fas fa-copy"></i></button>
                <button type="button" class="control-btn" @click.stop="handleDelete(index, item.name)"><i class="fas fa-trash-alt"></i></button>
              </div>
            </div>
          </div>
        </template>
      </div>

      <div class="admin-pagination pagination">
        <button type="button" class="pagination__btn" :disabled="currentPage <= 1" @click="handlePageChange(currentPage - 1)">‹</button>
        <button v-for="p in pageNumbers" :key="p" type="button" class="pagination__btn" :class="{ 'is-active': p === currentPage }" @click="handlePageChange(p)">{{ p }}</button>
        <button type="button" class="pagination__btn" :disabled="currentPage >= totalPages" @click="handlePageChange(currentPage + 1)">›</button>
      </div>
      <div v-if="nextCursor" class="admin-load-more">
        <button type="button" class="button-secondary" @click="loadMore">加载更多</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>Powered By <a href="https://github.com/cf-pages/Telegraph-Image" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Telegraph-Image</a></p>
      </div>
    </footer>

    <div class="lightbox" :class="{ 'is-open': lightboxUrl }" @click="lightboxUrl = null">
      <img v-if="lightboxUrl" :src="lightboxUrl" alt="preview" @click.stop>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
  <script src="./assets/js/admin-ui.js"></script>
  <script src="./assets/js/admin-auth.js"></script>
  <script>
    AdminUI.installVue(Vue);
    new Vue({
      el: '#app',
      data: {
        baseURL: document.location.origin,
        Number: 0,
        fileConfig: {
          image: { name: '图片', exts: ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'tiff', 'ico'], icon: 'fas fa-image', count: 0 },
          video: { name: '视频', exts: ['mp4', 'webm', 'ogg', 'avi', 'mov', 'wmv', 'flv', 'mkv'], icon: 'fas fa-video', count: 0 },
          audio: { name: '音频', exts: ['mp3', 'wav', 'ogg', 'flac', 'aac', 'm4a', 'wma'], icon: 'fas fa-music', count: 0 },
          document: { name: '文件', exts: [], icon: 'fas fa-folder-open', count: 0 }
        },
        uploadConfig: { maxSize: 20 * 1024 * 1024, maxConcurrent: 3 },
        tableData: [],
        nextCursor: null,
        search: '',
        currentPage: 1,
        pageSize: 15,
        sortOption: 'dateDesc',
        filterOption: 'all',
        fileType: 'image',
        openDropdown: null,
        activePopover: null,
        lightboxUrl: null,
        quickWebsites: [
          { name: '原版后台', url: './admin.html', icon: 'fas fa-suitcase' },
          { name: '瀑布流', url: './admin-waterfall.html', icon: 'fas fa-wind' },
          { name: 'Movavi', url: 'https://www.movavi.com/zh/movavi-video-converter.html', icon: 'fas fa-file-video' },
          { name: 'FreeConvert', url: 'https://www.freeconvert.com/zh/video-compressor', icon: 'fas fa-file' },
          { name: 'YouCompress', url: 'https://www.youcompress.com/zh-cn/', icon: 'fas fa-file-zipper' },
          { name: 'Cloudinary', url: 'https://console.cloudinary.com/', icon: 'fas fa-cloud' }
        ]
      },
      computed: {
        filteredTableData() {
          return this.tableData.filter(data => {
            const searchLower = this.search.toLowerCase();
            const matchesSearch = !searchLower || [
              (data.metadata.fileName || '').toLowerCase(),
              data.name?.toLowerCase()
            ].some(field => field?.includes(searchLower));
            const matchesFilter = {
              all: true,
              favorites: data.metadata.liked,
              blocked: data.metadata.ListType === 'Block',
              unblocked: data.metadata.ListType === 'White',
              adult: data.metadata.Label?.toLowerCase() === 'adult'
            }[this.filterOption] ?? true;
            const ext = data.name.split('.').pop().toLowerCase();
            const matchesType = this.fileType === 'document'
              ? !Object.keys(this.fileConfig).some(type => type !== 'document' && this.fileConfig[type].exts.includes(ext))
              : this.fileConfig[this.fileType].exts.includes(ext);
            return matchesSearch && matchesFilter && matchesType;
          });
        },
        paginatedTableData() {
          return this.sortData(this.filteredTableData.slice())
            .slice((this.currentPage - 1) * this.pageSize, this.currentPage * this.pageSize);
        },
        totalPages() {
          return Math.max(1, Math.ceil(this.filteredTableData.length / this.pageSize));
        },
        pageNumbers() {
          const pages = [];
          const total = this.totalPages;
          const current = this.currentPage;
          let start = Math.max(1, current - 2);
          let end = Math.min(total, start + 4);
          start = Math.max(1, end - 4);
          for (let i = start; i <= end; i++) pages.push(i);
          return pages;
        },
        sortIcon() { return `fas fa-sort-${this.sortOption === 'dateDesc' ? 'amount-down' : 'alpha-up'}`; },
        filterIcon() {
          return this.filterOption === 'all' ? 'fas fa-filter' :
            this.filterOption === 'favorites' ? 'fas fa-bookmark' :
            this.filterOption === 'blocked' ? 'fas fa-lock' :
            this.filterOption === 'unblocked' ? 'fas fa-unlock' :
            this.filterOption === 'adult' ? 'fas fa-user-secret' : '';
        },
        fileTypeIcon() {
          return this.fileType === 'image' ? 'fas fa-image' :
            this.fileType === 'video' ? 'fas fa-video' :
            this.fileType === 'audio' ? 'fas fa-music' :
            this.fileType === 'document' ? 'fas fa-folder-open' : '';
        },
        selectedFiles() {
          return this.tableData.filter(file => file.selected);
        }
      },
      watch: {
        sortOption(newOption) { localStorage.setItem('sortOption', newOption); },
        filterOption(newOption) { localStorage.setItem('filterOption', newOption); },
        filteredTableData() {
          if (this.currentPage > this.totalPages) this.currentPage = this.totalPages;
        }
      },
      methods: {
        toggleDropdown(name) {
          this.openDropdown = this.openDropdown === name ? null : name;
        },
        closeDropdown() { this.openDropdown = null; },
        togglePopover(name) {
          this.activePopover = this.activePopover === name ? null : name;
        },
        openLightbox(url) { this.lightboxUrl = url; },
        refreshDashboard() { location.reload(); },
        handleLogout() { AdminAuth.logout(); },
        handlePageChange(page) {
          if (page < 1 || page > this.totalPages) return;
          this.currentPage = page;
        },
        handleUpload() { this.$refs.fileInput.click(); },
        sort(command) { this.sortOption = command; },
        filter(command) { this.filterOption = command; },
        loadMore() {
          const opts = { method: 'GET', credentials: 'include' };
          const url = this.nextCursor
            ? `./api/manage/list?cursor=${encodeURIComponent(this.nextCursor)}`
            : `./api/manage/list?limit=100`;
          fetch(url, opts)
            .then(r => r.json())
            .then(result => {
              const files = result.keys || [];
              const mapped = files.map(file => ({
                ...file,
                selected: false,
                metadata: {
                  ...file.metadata,
                  liked: file.metadata.liked ?? false,
                  fileName: file.metadata.fileName ?? file.name,
                  fileSize: file.metadata.fileSize ?? 0
                }
              }));
              this.tableData = this.tableData.concat(mapped);
              this.nextCursor = result.list_complete ? null : result.cursor;
              this.updateStats();
            })
            .catch(() => this.$message.error('同步数据时出错，请检查网络连接'));
        },
        sortData(data) {
          if (this.sortOption === 'nameAsc') return data.sort((a, b) => a.name.localeCompare(b.name));
          if (this.sortOption === 'sizeDesc') return data.sort((a, b) => b.metadata.fileSize - a.metadata.fileSize);
          return data.sort((a, b) => b.metadata.TimeStamp - a.metadata.TimeStamp);
        },
        formattedFileDetails(item) {
          const metadata = item.metadata;
          const timestamp = new Date(metadata.TimeStamp).toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });
          return `<div style="text-align:left"><div><strong>ID：</strong>${item.name}</div><div><strong>文件名：</strong>${metadata.fileName || item.name}</div><div><strong>上传时间：</strong>${timestamp}</div><div><strong>元数据：</strong>${JSON.stringify(metadata)}</div></div>`;
        },
        calculatePageSize() {
          const config = { minSize: 15, cardWidth: 240, ratio: 3/4, gap: 20, defaultWidth: 800, defaultHeaderHeight: 64 };
          const content = document.querySelector('.admin-grid');
          const header = document.querySelector('.admin-top-nav');
          const width = content?.clientWidth || config.defaultWidth;
          const height = window.innerHeight - (header?.offsetHeight || config.defaultHeaderHeight);
          const cols = Math.floor(width / (config.cardWidth + config.gap));
          const cardHeight = (width / Math.max(cols, 1) - config.gap) * config.ratio;
          const rows = Math.floor(height / (cardHeight + config.gap));
          this.pageSize = Math.max(rows * Math.max(cols, 1), config.minSize);
        },
        updateWindowWidth() { this.calculatePageSize(); },
        updateStats() {
          this.Number = this.tableData.length;
          const fileCount = { image: 0, video: 0, audio: 0, document: 0 };
          this.tableData.forEach(file => {
            const ext = file.name.split('.').pop().toLowerCase();
            const type = Object.keys(this.fileConfig).find(t => this.fileConfig[t].exts.includes(ext)) || 'document';
            fileCount[type]++;
          });
          Object.keys(this.fileConfig).forEach(type => { this.fileConfig[type].count = fileCount[type] || 0; });
        },
        async uploadFiles(event) {
          const files = Array.from(event.target.files || []);
          if (!files.length) return;
          const config = this.uploadConfig;
          const valid = [], invalid = [];
          files.forEach(file => { (file.size <= config.maxSize ? valid : invalid).push(file); });
          if (invalid.length) this.$message.error(`文件超过${config.maxSize/1024/1024}MB: \n${invalid.map(f => f.name).join('\n')}`);
          if (!valid.length) { this.$message({ message: '没有符合条件的文件', type: 'info' }); event.target.value = ''; return; }
          try {
            await this.$confirm(`确定要上传这 ${valid.length} 个文件吗?`, '提示');
            const loading = this.$message({ message: '上传中...', duration: 0 });
            let successCount = 0, failed = [];
            const upload = async file => {
              try {
                const formData = new FormData();
                formData.append('file', file);
                const res = await fetch(`${this.baseURL}/upload`, { method: 'POST', body: formData, credentials: 'include' });
                const data = await res.json();
                if (!res.ok || (Array.isArray(data) && data[0]?.error)) throw new Error(data[0]?.error || '上传失败');
                const src = data[0]?.src;
                if (!src) throw new Error('未返回文件路径');
                const preview = await fetch(`${this.baseURL}${src}`, { credentials: 'include' });
                if (preview.ok) {
                  this.tableData.unshift({ name: src.replace(/^\/file\//, ''), selected: false, metadata: { TimeStamp: Date.now(), fileSize: file.size, fileName: file.name } });
                  successCount++;
                }
              } catch (err) { failed.push(`${file.name} (${err.message})`); }
            };
            for (let i = 0; i < valid.length; i += config.maxConcurrent) {
              await Promise.all(valid.slice(i, i + config.maxConcurrent).map(upload));
            }
            loading.close();
            if (successCount) this.$message.success(`成功上传 ${successCount} 个文件`);
            if (failed.length) this.$message.error(`上传失败: ${failed.join(', ')}`);
            this.refreshFileList();
          } catch { this.$message({ message: '已取消上传', type: 'info' }); }
          event.target.value = '';
        },
        refreshFileList() {
          fetch('./api/manage/list?limit=100', { method: 'GET', credentials: 'include' })
            .then(response => response.json())
            .then(result => {
              const files = result.keys || [];
              this.tableData = files.map(file => ({
                ...file, selected: false,
                metadata: { ...file.metadata, liked: file.metadata.liked ?? false, fileName: file.metadata.fileName ?? file.name, fileSize: file.metadata.fileSize ?? 0 }
              }));
              this.nextCursor = result.list_complete ? null : result.cursor;
              this.updateStats();
              this.sortData(this.tableData);
            })
            .catch(() => this.$message.error('刷新文件列表失败，请检查网络连接'));
        },
        toggleSelect(index, name) {
          const fileIndex = this.tableData.findIndex(file => file.name === name);
          this.tableData[fileIndex].selected = !this.tableData[fileIndex].selected;
        },
        clearSelection() {
          this.tableData.forEach(file => { file.selected = false; });
        },
        toggleLike(index, name) {
          const fileIndex = this.tableData.findIndex(file => file.name === name);
          this.tableData[fileIndex].metadata.liked = !(this.tableData[fileIndex].metadata.liked ?? false);
          fetch(`./api/manage/toggleLike/${name}`, { method: 'GET', credentials: 'include' })
            .then(response => response.json())
            .then(result => {
              if (!result.success) {
                this.tableData[fileIndex].metadata.liked = !this.tableData[fileIndex].metadata.liked;
                this.$message.error('更新收藏状态失败，请稍后重试');
              } else {
                this.$message.success(this.tableData[fileIndex].metadata.liked ? '收藏成功' : '取消收藏');
              }
            })
            .catch(() => {
              this.tableData[fileIndex].metadata.liked = !this.tableData[fileIndex].metadata.liked;
              this.$message.error('同步服务器失败，请检查网络连接');
            });
        },
        handleDelete(index, key) {
          this.$confirm('此操作将永久删除该文件, 是否继续?', '提示').then(() => {
            fetch(`./api/manage/delete/${key}`, { method: 'GET', credentials: 'include' })
              .then(response => {
                if (!response.ok) return Promise.reject();
                const idx = this.tableData.findIndex(f => f.name === key);
                if (idx !== -1) this.tableData.splice(idx, 1);
              })
              .then(() => { this.updateStats(); this.$message.success('删除成功！'); })
              .catch(() => this.$message.error('删除失败，请检查网络连接'));
          }).catch(() => this.$message({ message: '已取消删除', type: 'info' }));
        },
        copyToClipboardFallback(text) {
          const textarea = document.createElement('textarea');
          document.body.appendChild(textarea);
          textarea.style.position = 'fixed';
          textarea.style.clip = 'rect(0 0 0 0)';
          textarea.style.top = '10px';
          textarea.value = text;
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        },
        handleCopy(index, key) {
          const link = `${this.baseURL}/file/${key}`;
          (navigator.clipboard?.writeText(link) || Promise.resolve(this.copyToClipboardFallback(link)))
            .then(() => this.$message.success('复制文件链接成功~'))
            .catch(() => this.$message.error('自动复制失败，请手动复制链接：' + link));
        },
        selectAllInPage() {
          const selected = !this.paginatedTableData.every(file => file.selected);
          this.paginatedTableData.forEach(file => { file.selected = selected; });
        },
        handleBatchDelete() {
          const files = this.selectedFiles.slice();
          this.$confirm('此操作将永久删除这 ' + files.length + ' 个文件, 是否继续?', '提示').then(() => {
            Promise.all(files.map(file => fetch(`./api/manage/delete/${file.name}`, { method: 'GET', credentials: 'include' })))
              .then(results => {
                results.forEach((response, idx) => {
                  if (response.ok) {
                    const fileIndex = this.tableData.findIndex(file => file.name === files[idx].name);
                    if (fileIndex !== -1) this.tableData.splice(fileIndex, 1);
                  }
                });
                this.clearSelection();
                this.updateStats();
                this.$message.success('批量删除成功!');
              })
              .catch(() => this.$message.error('批量删除失败，请检查网络连接'));
          }).catch(() => this.$message({ message: '已取消批量删除', type: 'info' }));
        },
        handleBatchCopy() {
          const links = this.selectedFiles.map(file => `${document.location.origin}/file/${file.name}`).join('\n');
          (navigator.clipboard?.writeText(links) || Promise.resolve(this.copyToClipboardFallback(links)))
            .then(() => this.$message.success('批量复制链接成功~'));
        },
        handleBatchDownload() {
          const files = this.selectedFiles.slice();
          this.$message.info(`正在下载 ${files.length} 个文件`);
          files.forEach((file, index) => {
            setTimeout(() => {
              const link = document.createElement('a');
              link.href = `/file/${file.name}`;
              link.download = file.metadata.fileName || file.name;
              link.click();
            }, index * 800);
          });
          this.clearSelection();
        },
        handleBatchBlockOrUnblock(type) {
          if (type !== 'Block' && type !== 'White') { this.$message.error('无效的操作类型'); return; }
          const typeToName = { Block: '黑名单', White: '白名单' };
          const files = this.selectedFiles.slice();
          this.$confirm(`确定要将这 ${files.length} 个文件加入${typeToName[type]}吗?`, '提示').then(() => {
            Promise.all(files.map(file => fetch(`./api/manage/${type.toLowerCase()}/${file.name}`, { method: 'GET', credentials: 'include' })))
              .then(responses => {
                responses.forEach((response, index) => {
                  if (response.ok) {
                    const fileIndex = this.tableData.findIndex(item => item.name === files[index].name);
                    if (fileIndex !== -1) this.tableData[fileIndex].metadata.ListType = type;
                  }
                });
                this.$message.success(`批量加入${typeToName[type]}成功`);
                this.clearSelection();
              })
              .catch(() => this.$message.error('操作失败，请检查网络连接'));
          });
        },
        handleBatchOperation(command) {
          if (this.selectedFiles.length === 0) { this.$message.warning('请先选择文件'); return; }
          switch (command) {
            case 'copy': this.handleBatchCopy(); break;
            case 'delete': this.handleBatchDelete(); break;
            case 'download': this.handleBatchDownload(); break;
            case 'block': this.handleBatchBlockOrUnblock('Block'); break;
            case 'unblock': this.handleBatchBlockOrUnblock('White'); break;
          }
        },
        handleToolkit(command) {
          switch (command) {
            case 'selectAllInPage': this.selectAllInPage(); break;
            case 'checkBrokenFiles': this.checkBrokenFiles(); break;
            case 'editWebsites': this.editWebsites(); break;
          }
        },
        switchFileType(type) {
          this.fileType = type;
          this.currentPage = 1;
          localStorage.setItem('fileType', type);
          this.$message.success(`已切换为${this.fileConfig[type].name}模式, 共${this.fileConfig[type].count}个文件`);
        },
        checkBrokenFiles() {
          const loadingMessage = this.$message({ message: '正在检测失效文件...', duration: 0 });
          let brokenCount = 0;
          const promises = this.tableData.map(item => new Promise(resolve => {
            fetch(`${this.baseURL}/file/${item.name}`, { method: 'HEAD', cache: 'no-cache' })
              .then(response => {
                if (!response.ok) { brokenCount++; item.selected = true; resolve({ status: 'error' }); }
                else resolve({ status: 'success' });
              })
              .catch(() => { brokenCount++; item.selected = true; resolve({ status: 'error' }); });
          }));
          Promise.all(promises).then(() => {
            loadingMessage.close();
            if (brokenCount > 0) this.$message.warning(`检测到 ${brokenCount} 个失效文件，已自动选中。可使用批量删除功能移除它们。`);
            else this.$message.success('未检测到失效文件');
          });
        },
        handleWebsite(url) { window.open(url, '_blank'); },
        editWebsites() {
          const websiteText = this.quickWebsites.map(site => `${site.name}|${site.url}|${site.icon}`).join('\n');
          this.$prompt('', '编辑快捷方式', {
            inputType: 'textarea',
            inputValue: websiteText,
            message: '每行一个网站，格式：名称|网址|图标类名',
            inputValidator: (value) => {
              const lines = value.split('\n');
              if (lines.length > 10) return '不能超过10行';
              for (const line of lines) {
                if (!line.trim()) continue;
                const [name, url, icon = 'fas fa-link'] = line.split('|');
                if (!name || !url) return '名称和网址不能为空：' + line;
                if (!(/^https?:\/\/.+/.test(url) || /^\.\/.*/.test(url))) return '网址格式错误：' + line;
                if (!/^(fas?|fa-brands|fa-regular|fa-solid)\s+fa-[a-z0-9-]+$/.test(icon)) return '图标类名格式错误：' + line;
              }
              return true;
            }
          }).then(({ value }) => {
            const newSites = value.split('\n').filter(line => line.trim()).map(line => {
              const [name, url, icon = 'fas fa-link'] = line.split('|');
              return { name, url, icon };
            });
            this.quickWebsites = newSites;
            localStorage.setItem('quickWebsites', JSON.stringify(newSites));
            this.$message.success('保存成功');
          }).catch(() => {});
        },
        getFileIcon(filename) {
          const ext = filename.split('.').pop().toLowerCase();
          const iconMap = {
            'pdf': 'fas fa-file-pdf',
            'doc,docx': 'fas fa-file-word',
            'xls,xlsx,csv': 'fas fa-file-excel',
            'ppt,pptx': 'fas fa-file-powerpoint',
            'txt,md,log': 'fas fa-file-lines',
            'zip,rar,7z,tar,gz': 'fas fa-file-zipper',
            'html,htm,css,js,ts,jsx,tsx,vue,php,py,java,c,cpp,h,hpp,cs,go,rs,rb,pl,sh,sql': 'fas fa-file-code',
            'json,xml,yaml,yml,toml': 'fas fa-file-code',
            'mp4,avi,mov,wmv,flv,mkv,webm': 'fas fa-file-video',
            'mp3,wav,ogg,flac,aac,m4a,wma': 'fas fa-file-audio',
            'jpg,jpeg,png,gif,bmp,webp,svg,ico': 'fas fa-file-image',
            'psd,ai,eps,cdr': 'fas fa-file-image',
            'exe,msi,app,dmg,deb,rpm': 'fas fa-file-arrow-down'
          };
          for (const [exts, icon] of Object.entries(iconMap)) {
            if (exts.split(',').includes(ext)) return icon;
          }
          return 'fas fa-file';
        },
        getFileType(filename) { return filename.split('.').pop().toUpperCase(); },
        handleEditName(item) {
          this.$prompt('', '修改文件名', {
            inputValue: item.metadata?.fileName || item.name,
            inputValidator: (value) => {
              if (!value) return '文件名不能为空';
              if (value.length > 64) return '文件名不能超过64个字符';
              return true;
            }
          }).then(({ value }) => {
            fetch(`./api/manage/editName/${item.name}?newName=${encodeURIComponent(value)}`, { method: 'GET', credentials: 'include' })
              .then(response => response.json())
              .then(result => {
                if (result.success) { item.metadata.fileName = value; this.$message.success('文件名修改成功'); }
                else this.$message.error('文件名修改失败');
              })
              .catch(() => this.$message.error('修改文件名时出错，请检查网络连接'));
          }).catch(() => {});
        },
        loadInitialList() {
          fetch('./api/manage/list?limit=100', { method: 'GET', credentials: 'include' })
            .then(response => {
              if (response.status === 401) {
                AdminAuth.redirectToLogin();
                return null;
              }
              return response.json();
            })
            .then(result => {
              if (!result) return;
              const files = result.keys || [];
              this.nextCursor = result.list_complete ? null : result.cursor;
              this.tableData = files.map(file => ({
                ...file, selected: false,
                metadata: { ...file.metadata, liked: file.metadata.liked ?? false, fileName: file.metadata.fileName ?? file.name, fileSize: file.metadata.fileSize ?? 0 }
              }));
              this.updateStats();
              this.sortOption = localStorage.getItem('sortOption') || this.sortOption;
              this.sortData(this.tableData);
              this.fileType = localStorage.getItem('fileType') || this.fileType;
              this.switchFileType(this.fileType);
            })
            .catch(() => this.$message.error('同步数据时出错，请检查网络连接'));
        }
      },
      mounted() {
        window.addEventListener('resize', this.calculatePageSize);
        this.updateWindowWidth();
        document.addEventListener('click', () => { this.activePopover = null; });
        if (localStorage.getItem('quickWebsites')) {
          this.quickWebsites = JSON.parse(localStorage.getItem('quickWebsites'));
        }
        AdminAuth.ensureAuth().then((auth) => {
          if (auth.enabled && !auth.authenticated) {
            AdminAuth.redirectToLogin();
            return;
          }
          this.loadInitialList();
        }).catch(() => this.$message.error('同步数据时出错，请检查网络连接'));
      },
      beforeDestroy() {
        window.removeEventListener('resize', this.calculatePageSize);
      }
    });
  </script>
</body>
</html>
