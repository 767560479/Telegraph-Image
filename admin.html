<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Telegraph-Image | Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages/admin.css">
  <script src="https://js.sentry-cdn.com/219f636ac7bde5edab2c3e16885cb535.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app" class="admin-page">
    <header class="admin-top-nav">
      <div class="admin-top-nav__inner">
        <span class="admin-top-nav__title">Dashboard</span>
        <div class="admin-top-nav__actions" style="margin-left: auto;">
          <div class="admin-view-switch">
            <a href="./admin-imgtc.html" class="button-secondary button-secondary--sm">网格视图</a>
            <a href="./admin-waterfall.html" class="button-secondary button-secondary--sm">瀑布流</a>
            <button v-if="showLogoutButton" type="button" class="button-text-link" @click="handleLogout()">退出登录</button>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div class="admin-stats-bar">
        <div class="feature-card">
          <span class="text-muted">记录总数量</span>
          <span class="admin-stats-bar__count">{{ Number }}</span>
        </div>
      </div>

      <div class="admin-table-toolbar">
        <input v-model="search" @input="handleSearch" class="text-input admin-table-toolbar__search" type="search" placeholder="输入关键字搜索">
      </div>

      <div class="data-table-wrap">
        <table class="data-table data-table--admin">
          <thead>
            <tr>
              <th class="data-table__col-name">名称</th>
              <th class="data-table__col-preview">预览</th>
              <th class="data-table__col-data">元数据</th>
              <th class="data-table__col-actions">操作</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="(row, index) in filteredData" :key="row.name">
              <td class="data-table__col-name">
                <span class="data-table__name" :title="displayName(row)">{{ displayName(row) }}</span>
              </td>
              <td class="data-table__col-preview">
                <video v-if="row.name && row.name.indexOf('.mp4') > 0" class="data-table__preview" controls>
                  <source :src="'/file/' + row.name" type="video/mp4">
                </video>
                <img v-else class="data-table__preview" :src="'/file/' + row.name" loading="lazy" :alt="displayName(row)" @click="openLightbox('/file/' + row.name)">
              </td>
              <td class="data-table__col-data">
                <span class="data-table__meta badge-pill" :title="formatMetadataFull(row.metadata)">{{ formatMetadata(row.metadata) }}</span>
              </td>
              <td class="data-table__col-actions">
                <div class="data-table__actions">
                  <button type="button" class="button-primary button-secondary--sm" @click="handleCopy(row.name)">复制地址</button>
                  <button type="button" class="button-secondary button-secondary--sm" @click="handleWhite(row.name)">白名单</button>
                  <button type="button" class="button-secondary button-secondary--sm" @click="handleBlock(row.name)">黑名单</button>
                  <button type="button" class="button-secondary button-secondary--sm" @click="handleDelete(row.name)">删除</button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div v-if="nextCursor" class="admin-load-more">
        <button type="button" class="button-secondary" @click="loadMore">加载更多</button>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container site-footer__inner">
        <p>Powered By <a href="https://github.com/cf-pages/Telegraph-Image" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-github"></i> Telegraph-Image</a></p>
      </div>
    </footer>

    <div class="lightbox" :class="{ 'is-open': lightboxUrl }" @click="lightboxUrl = null">
      <img v-if="lightboxUrl" :src="lightboxUrl" alt="preview" @click.stop>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js" crossorigin="anonymous"></script>
  <script src="./assets/js/admin-ui.js"></script>
  <script>
    AdminUI.installVue(Vue);
    new Vue({
      el: '#app',
      data: {
        Number: 0,
        showLogoutButton: false,
        tableData: [],
        nextCursor: null,
        search: '',
        searchTimer: null,
        lightboxUrl: null
      },
      computed: {
        filteredData() {
          if (!this.search) return this.tableData;
          const q = this.search.toLowerCase();
          return this.tableData.filter(function (data) {
            var meta = data.metadata || {};
            var fileName = (meta.fileName || '').toLowerCase();
            var name = (data.name || '').toLowerCase();
            return name.includes(q) || fileName.includes(q);
          });
        }
      },
      methods: {
        openLightbox(url) { this.lightboxUrl = url; },
        parseMetadata(meta) {
          if (!meta) return {};
          if (typeof meta === 'string') {
            try { return JSON.parse(meta); } catch (e) { return {}; }
          }
          return meta;
        },
        normalizeKeys(keys) {
          return (keys || []).map(function (k) {
            return {
              name: k.name,
              metadata: typeof k.metadata === 'object' && k.metadata !== null ? k.metadata : {}
            };
          });
        },
        displayName(row) {
          if (!row) return '—';
          var meta = this.parseMetadata(row.metadata);
          return meta.fileName || row.name || '—';
        },
        formatMetadata(meta) {
          var obj = this.parseMetadata(meta);
          var text = JSON.stringify(obj);
          return text.length > 48 ? text.slice(0, 48) + '…' : text;
        },
        formatMetadataFull(meta) {
          return JSON.stringify(this.parseMetadata(meta));
        },
        findRowIndex(key) {
          return this.tableData.findIndex(function (r) { return r.name === key; });
        },
        handleBlock(key) {
          if (!confirm('确认加入黑名单吗?')) return;
          fetch('./api/manage/block/' + key, { method: 'GET', credentials: 'include' })
            .then(function (response) { return response.text(); })
            .then(function (result) {
              var idx = this.findRowIndex(key);
              if (idx !== -1) this.tableData[idx].metadata = this.parseMetadata(result);
            }.bind(this))
            .catch(function () { alert('同步失败，请检查网络连接'); });
        },
        handleDelete(key) {
          if (!confirm('确认删除该条记录吗?')) return;
          fetch('./api/manage/delete/' + key, { method: 'GET', credentials: 'include' })
            .then(function (response) { return response.text(); })
            .then(function () {
              var idx = this.findRowIndex(key);
              if (idx !== -1) {
                this.tableData.splice(idx, 1);
                this.Number = this.tableData.length;
              }
            }.bind(this))
            .catch(function () { alert('同步失败，请检查网络连接'); });
        },
        handleWhite(key) {
          if (!confirm('确认加入白名单吗?')) return;
          fetch('./api/manage/white/' + key, { method: 'GET', credentials: 'include' })
            .then(function (response) { return response.text(); })
            .then(function (result) {
              var idx = this.findRowIndex(key);
              if (idx !== -1) this.tableData[idx].metadata = this.parseMetadata(result);
            }.bind(this))
            .catch(function () { alert('同步失败，请检查网络连接'); });
        },
        handleLogout() { window.location.href = './api/manage/logout'; },
        handleCopy(key) {
          const text = document.location.origin + '/file/' + key;
          if (navigator.clipboard) {
            navigator.clipboard.writeText(text);
          } else {
            const textarea = document.createElement('textarea');
            document.body.appendChild(textarea);
            textarea.style.position = 'fixed';
            textarea.style.clip = 'rect(0 0 0 0)';
            textarea.style.top = '10px';
            textarea.value = text;
            textarea.select();
            document.execCommand('copy', true);
            document.body.removeChild(textarea);
          }
          this.$message.success('复制文件链接成功~');
        },
        handleSearch() {
          clearTimeout(this.searchTimer);
          this.searchTimer = setTimeout(() => {
            this.tableData = [];
            this.nextCursor = null;
            const base = this.search
              ? './api/manage/list?limit=100&prefix=' + encodeURIComponent(this.search)
              : './api/manage/list?limit=100';
            fetch(base, { method: 'GET', credentials: 'include' })
              .then(r => r.json())
              .then(result => {
                this.tableData = this.normalizeKeys(result.keys);
                this.nextCursor = result.list_complete ? null : result.cursor;
                this.Number = this.tableData.length;
              })
              .catch(() => alert('搜索失败，请检查网络'));
          }, 300);
        },
        loadMore() {
          const base = this.search
            ? './api/manage/list?limit=100&prefix=' + encodeURIComponent(this.search)
            : './api/manage/list?limit=100';
          const url = this.nextCursor ? base + '&cursor=' + encodeURIComponent(this.nextCursor) : base;
          fetch(url, { method: 'GET', credentials: 'include' })
            .then(r => r.json())
            .then(result => {
              this.tableData = this.tableData.concat(this.normalizeKeys(result.keys));
              this.nextCursor = result.list_complete ? null : result.cursor;
              this.Number = this.tableData.length;
            })
            .catch(() => alert('同步失败，请检查网络'));
        }
      },
      mounted() {
        fetch('./api/manage/check', { method: 'GET', credentials: 'include' })
          .then(response => response.text())
          .then(result => {
            if (result === 'true') this.showLogoutButton = true;
            else if (result !== 'Not using basic auth.') window.location.href = './api/manage/login';
          })
          .catch(() => alert('同步失败，请检查网络连接'));

        fetch('./api/manage/list?limit=100', { method: 'GET', credentials: 'include' })
          .then(response => {
            if (response.status === 401) {
              alert('请先登录');
              window.location.href = './api/manage/login';
              return null;
            }
            return response.json();
          })
          .then(result => {
            if (!result) return;
            this.tableData = this.normalizeKeys(result.keys);
            this.nextCursor = result.list_complete ? null : result.cursor;
            this.Number = this.tableData.length;
          })
          .catch(() => alert('同步失败，请检查网络连接'));
      }
    });
  </script>
</body>
</html>
